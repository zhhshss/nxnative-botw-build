name: PickerTests
options:
  bundleIdPrefix: org.nxnative.pickerchecks
  deploymentTarget:
    iOS: '26.0'
targets:
  PickerTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PickerTests.swift
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_IDENTITY: '-'
schemes:
  PickerTests:
    build:
      targets:
        PickerTests: all
    test:
      targets:
        - PickerTests
