name: Touch the Wild Windows host and controls

on:
  workflow_dispatch:
    inputs:
      probe_only:
        description: 'Inspect installed Apple toolchains without building or downloading game files'
        type: boolean
        default: false
      checks_only:
        description: 'Run current upstream validation without downloading or building the game'
        type: boolean
        default: false
      romfs:
        description: 'Data delivery: nxrom for independent reusable data and an app-only IPA'
        type: choice
        options: [nxrom, bundle, separate]
        default: separate
      publish_game_data:
        description: 'Publish the separate .nxrom artifact as well as the app'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-host.yml'
      - 'scripts/**'
      - 'plugin/**'
      - 'source-pins.json'
      - 'tests/**'
      - 'patches/**'

permissions:
  contents: read

concurrency:
  group: windows-host-${{ github.ref }}-${{ inputs.checks_only || false }}
  cancel-in-progress: true

jobs:
  apple-toolchain:
    if: ${{ inputs.probe_only == true }}
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - name: Inspect Xcode SDKs and Metal compiler identities
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, os, subprocess
          rows=[]
          for app in sorted(Path('/Applications').glob('Xcode*.app')):
              env=dict(os.environ, DEVELOPER_DIR=str(app/'Contents/Developer'))
              row={'application':str(app)}
              for name,cmd in [('xcode',['xcodebuild','-version']),('sdk',['xcrun','--sdk','iphoneos','--show-sdk-version']),('metal',['xcrun','--sdk','iphoneos','metal','--version'])]:
                  result=subprocess.run(cmd,env=env,capture_output=True,text=True,timeout=30)
                  row[name]={'returncode':result.returncode,'output':(result.stdout+result.stderr).strip()}
              rows.append(row)
          print(json.dumps(rows,indent=2))
          PY
  checks:
    if: ${{ inputs.probe_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install IPA delivery test prerequisites
        run: |
          python3 -m pip install --quiet cryptography
          sudo apt-get install -y --no-install-recommends libarchive-tools zip
      - name: Source-only input regression checks
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tests"
          for name in input touch stall_policy; do
            gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined "plugin/tests/${name}_test.c" -lm -o "$RUNNER_TEMP/tests/$name"
            "$RUNNER_TEMP/tests/$name"
          done
          python3 -m compileall -q scripts
          python3 -m unittest discover -s tests -v
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined plugin/tests/zip_test.c -lz -o "$RUNNER_TEMP/tests/zip"
          "$RUNNER_TEMP/tests/zip"

  touch-checks:
    if: ${{ inputs.probe_only != true }}
    name: Native aspect, input, and UIKit handler tests
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: devinhurry/touch-the-wild
          ref: c671dd0b27f4ee4691d26e86dd7ad9de58c9f577
          path: upstream
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: xbunax/nxnative
          ref: d1ba3e97876da86ff616c6d8e8d684b968fb8c5d
          path: fork
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: devinhurry/touch-the-wild
          ref: e1b4196c589735c8b74cfe1f555167a6f380ae88
          path: legacy
          persist-credentials: false
      - name: Prepare current touch source with reusable legacy data
        run: python3 scripts/prepare_touch_upstream.py --upstream upstream --legacy-source legacy --fork fork --output "$RUNNER_TEMP/stage" --lite
      - name: Restore the pinned translator files for graphics contract tests
        run: |
          for d in dmsh_xlate_bin spirv_cross_bin; do
            cp -Rp "$GITHUB_WORKSPACE/upstream/dm/gfx/tools/$d/." "$RUNNER_TEMP/stage/dm/gfx/tools/$d/"
          done
      - name: CI input reclamation and portable shader reuse regressions
        env:
          BOTW_CI_STAGE: ${{ runner.temp }}/stage
        run: python3 -m unittest discover -s tests -p test_ipa_ci_stage.py -v
      - name: Host and real UIKit handler regressions without game files
        run: python3 scripts/check_touch_controls.py --stage "$RUNNER_TEMP/stage" --output "$RUNNER_TEMP/touch-tests"
      - name: Render backport compilation, concurrency and available GPU regressions
        run: python3 scripts/check_render_pass.py --stage "$RUNNER_TEMP/stage" --output "$RUNNER_TEMP/render-tests"
      - name: Reviewed render backport source and shader-cache compatibility
        env:
          BOTW_CI_STAGE: ${{ runner.temp }}/stage
        run: python3 -m unittest discover -s tests -p test_current_touch_source.py -v
      - name: Original game-data importer and split distribution regressions
        env:
          BOTW_CI_STAGE: ${{ runner.temp }}/stage
        run: |
          python3 "$RUNNER_TEMP/stage/dm/ios/tests/test_game_data.py"
          python3 -m unittest discover -s tests -p test_split_game_data.py -v
          python3 -m unittest discover -s "$RUNNER_TEMP/stage/dm/tools/tests" -p test_graphics_pack.py -v
      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: touch-and-aspect-tests
          path: |
            ${{ runner.temp }}/touch-tests/*.log
            ${{ runner.temp }}/touch-tests/report.json
            ${{ runner.temp }}/touch-tests/uikit/*.log
            ${{ runner.temp }}/touch-tests/uikit/*.png
            ${{ runner.temp }}/touch-tests/uikit/*.txt
            ${{ runner.temp }}/touch-tests/uikit/*.ips
            ${{ runner.temp }}/touch-tests/uikit/*.crash
            ${{ runner.temp }}/render-tests/*.log
            ${{ runner.temp }}/render-tests/report.json
          if-no-files-found: warn
          retention-days: 14

  # The finished IPA needs the owner's game data and a Mac; it runs only when
  # the repository variable BUILD_IPA is true, so ordinary pushes never start it.
  ipa:
    if: ${{ github.event_name == 'workflow_dispatch' && vars.BUILD_IPA == 'true' && inputs.probe_only != true && inputs.checks_only != true }}
    uses: ./.github/workflows/build-ipa.yml
    with:
      romfs: ${{ inputs.romfs || 'separate' }}
      publish_game_data: ${{ inputs.publish_game_data }}
    secrets: inherit
