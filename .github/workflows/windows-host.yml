name: Touch the Wild Windows host and controls

on:
  workflow_dispatch:
    inputs:
      romfs:
        description: 'Data delivery: nxrom for independent reusable data and an app-only IPA'
        type: choice
        options: [nxrom, bundle, separate]
        default: nxrom
      publish_game_data:
        description: 'Publish the separate .nxrom artifact as well as the app'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-host.yml'
      - 'scripts/**'
      - 'plugin/**'
      - 'source-pins.json'
      - 'tests/**'
      - 'patches/**'

permissions:
  contents: read

concurrency:
  group: windows-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install IPA delivery test prerequisites
        run: |
          python3 -m pip install --quiet cryptography
          sudo apt-get install -y --no-install-recommends libarchive-tools zip
      - name: Source-only input regression checks
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tests"
          for name in input touch stall_policy; do
            gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined "plugin/tests/${name}_test.c" -lm -o "$RUNNER_TEMP/tests/$name"
            "$RUNNER_TEMP/tests/$name"
          done
          python3 -m compileall -q scripts
          python3 -m unittest discover -s tests -v
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined plugin/tests/zip_test.c -lz -o "$RUNNER_TEMP/tests/zip"
          "$RUNNER_TEMP/tests/zip"

  compile:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: devinhurry/touch-the-wild
          ref: e1b4196c589735c8b74cfe1f555167a6f380ae88
          path: upstream
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: xbunax/nxnative
          ref: d1ba3e97876da86ff616c6d8e8d684b968fb8c5d
          path: fork
          persist-credentials: false
      - name: Prepare the combined source tree
        run: python scripts/prepare_source_tree.py --upstream upstream --fork fork --output "$env:RUNNER_TEMP/stage" --lite
      - name: Install verified portable compiler and iOS headers
        run: python scripts/prepare_windows_tools.py --stage "$env:RUNNER_TEMP/stage" --out "$env:RUNNER_TEMP/tools"
      - name: Build plugin for the existing supported host
        run: python scripts/build_plugin.py --tools-manifest "$env:RUNNER_TEMP/tools/tools.json" --output "$env:RUNNER_TEMP/plugin"
      - name: Compile the latest host without game data
        run: python scripts/compile_host.py --stage "$env:RUNNER_TEMP/stage" --tools-manifest "$env:RUNNER_TEMP/tools/tools.json" --out "$env:RUNNER_TEMP/host" --artifact "$env:RUNNER_TEMP/artifacts/host-objects.zip" --jobs 4
      - name: Upload host objects and build record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nxnative-host-objects
          path: ${{ runner.temp }}/artifacts/host-objects.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload the plugin
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: NXKeyboard-0.3.2
          path: ${{ runner.temp }}/plugin/NXKeyboard-0.3.2-LiveContainer.zip
          if-no-files-found: warn
          retention-days: 14
      - name: Upload compile logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compile-logs
          path: ${{ runner.temp }}/host/host/logs
          if-no-files-found: warn
          retention-days: 7

  touch-checks:
    name: Native aspect, input, and UIKit handler tests
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: devinhurry/touch-the-wild
          ref: e1b4196c589735c8b74cfe1f555167a6f380ae88
          path: upstream
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: xbunax/nxnative
          ref: d1ba3e97876da86ff616c6d8e8d684b968fb8c5d
          path: fork
          persist-credentials: false
      - name: Prepare the same reviewed source tree as the Windows build
        run: python3 scripts/prepare_source_tree.py --upstream upstream --fork fork --output "$RUNNER_TEMP/stage" --lite --ipa-ci
      - name: CI input reclamation and portable shader reuse regressions
        env:
          BOTW_CI_STAGE: ${{ runner.temp }}/stage
        run: python3 -m unittest discover -s tests -p test_ipa_ci_stage.py -v
      - name: Host and real UIKit handler regressions without game files
        run: python3 scripts/check_touch_controls.py --stage "$RUNNER_TEMP/stage" --output "$RUNNER_TEMP/touch-tests"
      - name: Original game-data importer and split distribution regressions
        env:
          BOTW_CI_STAGE: ${{ runner.temp }}/stage
        run: |
          python3 "$RUNNER_TEMP/stage/dm/ios/tests/test_game_data.py"
          python3 -m unittest discover -s tests -p test_split_game_data.py -v
      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: touch-and-aspect-tests
          path: |
            ${{ runner.temp }}/touch-tests/*.log
            ${{ runner.temp }}/touch-tests/report.json
            ${{ runner.temp }}/touch-tests/uikit/*.log
            ${{ runner.temp }}/touch-tests/uikit/*.png
            ${{ runner.temp }}/touch-tests/uikit/*.txt
            ${{ runner.temp }}/touch-tests/uikit/*.ips
            ${{ runner.temp }}/touch-tests/uikit/*.crash
          if-no-files-found: warn
          retention-days: 14

  # The finished IPA needs the owner's game data and a Mac; it runs only when
  # the repository variable BUILD_IPA is true, so ordinary pushes never start it.
  ipa:
    if: ${{ github.event_name == 'workflow_dispatch' && vars.BUILD_IPA == 'true' }}
    uses: ./.github/workflows/build-ipa.yml
    with:
      romfs: ${{ inputs.romfs || 'nxrom' }}
      publish_game_data: ${{ inputs.publish_game_data }}
    secrets: inherit
